stages: [validate, test]

validate-template:
  stage: validate
  tags: [windows]
  script:
    - pwsh -File scripts/Test-Template.ps1

tosca-sap-tests:
  stage: test
  tags: [windows, tosca, sap]
  when: manual
  script:
    - pwsh -File scripts/Invoke-ToscaTests.ps1 -Mode distributed
  after_script:
    - pwsh -Command "if ($env:XRAY_CLIENT_ID -and $env:XRAY_CLIENT_SECRET -and $env:XRAY_PROJECT_KEY -and (Test-Path reports/tosca-results.xml)) { ./scripts/Publish-XrayResults.ps1 }"
  artifacts:
    when: always
    reports:
      junit: reports/tosca-results.xml
    paths:
      - reports/
